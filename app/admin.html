<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>관리자 — 꼬물상자</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="app-top">
    <div class="wrap app-top__inner">
      <a class="logo" href="index.html" aria-label="꼬물상자 앨범">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect class="logo__box" x="5" y="12" width="22" height="16" rx="4"/><rect class="logo__lid" x="3" y="8" width="26" height="6" rx="3"/><path class="logo__star" d="m16 1 1.6 3.3 3.6.5-2.6 2.5.6 3.6L16 9.2l-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z"/></svg>
        꼬물상자
      </a>
      <nav class="app-top__nav" aria-label="앱 메뉴">
        <a href="index.html">앨범</a>
        <a href="admin.html" aria-current="page">관리</a>
      </nav>
    </div>
  </header>

  <main class="app-main wrap" id="main">
    <div id="denied" class="empty" hidden>
      <b>관리자만 볼 수 있어요</b>
      <p class="muted">관리자로 등록된 계정으로 로그인해 주세요.</p>
    </div>

    <div id="admin" hidden>
      <div class="admin-head">
        <h1 class="page-title">관리</h1>
        <button class="btn btn--ghost btn--sm" id="reload" type="button">새로 고침</button>
      </div>
      <div class="stat-grid" id="stats" aria-live="polite"></div>

      <section class="admin-sec" aria-labelledby="orders-title">
        <div class="admin-sec__head">
          <h2 id="orders-title">하드북 주문</h2>
          <label class="admin-filter">
            <span class="muted">보기</span>
            <select class="input" id="order-filter">
              <option value="open">처리할 주문</option>
              <option value="all">전체</option>
            </select>
          </label>
        </div>
        <div class="table-wrap">
          <table class="admin-table">
            <thead><tr><th>접수</th><th>동화</th><th>표지 이름</th><th>받는 분</th><th>연락처 · 주소</th><th>주문 계정</th><th>상태</th></tr></thead>
            <tbody id="orders"></tbody>
          </table>
        </div>
      </section>

      <section class="admin-sec" aria-labelledby="fail-title">
        <div class="admin-sec__head"><h2 id="fail-title">만들기 실패 (최근 20건)</h2></div>
        <div class="table-wrap">
          <table class="admin-table">
            <thead><tr><th>시각</th><th>종류</th><th>이유</th><th>계정</th></tr></thead>
            <tbody id="fails"></tbody>
          </table>
        </div>
      </section>

      <section class="admin-sec" aria-labelledby="users-title">
        <div class="admin-sec__head"><h2 id="users-title">최근 가입자</h2></div>
        <div class="table-wrap">
          <table class="admin-table">
            <thead><tr><th>가입</th><th>이메일</th><th>아이</th><th>이용권</th><th>마지막 로그인</th></tr></thead>
            <tbody id="users"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
