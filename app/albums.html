<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>앨범 모아보기 — 꼬물상자</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="app-top">
    <div class="wrap app-top__inner">
      <a class="logo" href="index.html" aria-label="꼬물상자 앨범">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect class="logo__box" x="5" y="12" width="22" height="16" rx="4"/><rect class="logo__lid" x="3" y="8" width="26" height="6" rx="3"/><path class="logo__star" d="m16 1 1.6 3.3 3.6.5-2.6 2.5.6 3.6L16 9.2l-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z"/></svg>
        꼬물상자
      </a>
      <nav class="app-top__nav" aria-label="앱 메뉴"></nav>
    </div>
  </header>

  <main class="app-main wrap" id="main">
    <h1 class="page-title" id="title">앨범 모아보기</h1>
    <p class="muted" id="summary" style="margin-top:4px">불러오는 중…</p>

    <section class="admin-sec" aria-labelledby="shelf-title">
      <div class="admin-sec__head"><h2 id="shelf-title">달마다 쌓인 앨범</h2></div>
      <ul class="month-books" id="months"></ul>
    </section>

    <section class="admin-sec" aria-labelledby="works-title">
      <div class="admin-sec__head"><h2 id="works-title">받은 동화·노래</h2></div>
      <ul class="works" id="works"></ul>
    </section>

    <section class="admin-sec" aria-labelledby="photos-title">
      <div class="admin-sec__head"><h2 id="photos-title">올린 사진</h2><span class="muted" id="photo-count"></span></div>
      <button class="btn btn--primary btn--sm photo-book-open" id="photo-book-open" type="button" hidden>포토북으로 보기</button>
      <div class="photo-days" id="photos"></div>
    </section>
  </main>

  <dialog class="sheet photo-book" id="photo-book" aria-labelledby="photo-book-title">
    <form method="dialog" class="sheet__head">
      <h2 id="photo-book-title">우리 아이 포토북</h2>
      <button class="sheet__close" aria-label="포토북 닫기" autofocus>×</button>
    </form>
    <div class="photo-book__spread">
      <button class="photo-book__edge" id="photo-book-prev" type="button" aria-label="이전 장">‹</button>
      <div class="photo-book__paper" id="photo-book-page"></div>
      <button class="photo-book__edge" id="photo-book-next" type="button" aria-label="다음 장">›</button>
    </div>
    <p class="photo-book__count muted" id="photo-book-count" aria-live="polite"></p>
  </dialog>

  <dialog class="sheet photo-viewer" id="photo-viewer" aria-labelledby="photo-viewer-title">
    <form method="dialog">
      <div class="sheet__head">
        <h2 id="photo-viewer-title">사진 보기</h2>
        <button class="sheet__close" aria-label="닫기" autofocus>×</button>
      </div>
      <figure class="photo-viewer__figure">
        <img id="viewer-image" alt="">
        <figcaption id="viewer-caption" aria-live="polite"></figcaption>
      </figure>
      <div class="sheet__foot">
        <button type="button" class="btn btn--ghost btn--sm" id="viewer-prev">이전 사진</button>
        <button type="button" class="btn btn--ghost btn--sm" id="viewer-next">다음 사진</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script type="module" src="albums.js"></script>
</body>
</html>
