<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>로그인 — 꼬물상자</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="auth">
    <div class="card auth__card">
      <a class="auth__logo logo" href="../index.html" aria-label="꼬물상자 소개로 돌아가기">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect class="logo__box" x="5" y="12" width="22" height="16" rx="4"/><rect class="logo__lid" x="3" y="8" width="26" height="6" rx="3"/><path class="logo__star" d="m16 1 1.6 3.3 3.6.5-2.6 2.5.6 3.6L16 9.2l-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z"/></svg>
        꼬물상자
      </a>
      <p class="muted" style="text-align:center">우리 아이 기록으로 동화와 노래를 만들어요</p>

      <div class="social" aria-label="간편 로그인">
        <!-- 카카오: 비즈 앱 전환·Supabase 연결이 끝나면 hidden 을 지우세요 -->
        <button type="button" class="social__btn social__btn--kakao" data-provider="kakao" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3C6.48 3 2 6.5 2 10.8c0 2.78 1.86 5.22 4.66 6.6l-1 3.66c-.09.33.29.6.58.4l4.36-2.9c.46.05.93.08 1.4.08 5.52 0 10-3.5 10-7.84S17.52 3 12 3z"/></svg>
          카카오로 시작하기
        </button>
        <button type="button" class="social__btn social__btn--google" data-provider="google">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.45a5.52 5.52 0 0 1-2.4 3.62v3h3.88c2.27-2.09 3.57-5.17 3.57-8.81z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.9l-3.88-3.02c-1.07.72-2.45 1.15-4.06 1.15-3.13 0-5.78-2.11-6.72-4.95H1.27v3.11A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.28 14.28a7.2 7.2 0 0 1 0-4.56V6.61H1.27a12 12 0 0 0 0 10.78l4.01-3.11z"/><path fill="#EA4335" d="M12 4.77c1.76 0 3.34.61 4.59 1.8l3.44-3.44A11.5 11.5 0 0 0 12 0 12 12 0 0 0 1.27 6.61l4.01 3.11C6.22 6.88 8.87 4.77 12 4.77z"/></svg>
          구글로 시작하기
        </button>
        <p class="social__note">비밀번호 없이 바로 시작해요. 꼬물상자는 비밀번호를 받지도, 볼 수도 없어요.</p>
        <p class="social__or"><span>또는 이메일로</span></p>
      </div>

      <div class="auth__tabs" role="tablist" aria-label="로그인 또는 가입">
        <button type="button" role="tab" id="tab-in" aria-selected="true" aria-controls="auth-form">로그인</button>
        <button type="button" role="tab" id="tab-up" aria-selected="false" aria-controls="auth-form" tabindex="-1">처음이에요</button>
      </div>

      <form id="auth-form" class="stack" role="tabpanel" aria-labelledby="tab-in" novalidate>
        <label class="field">
          <span>이메일</span>
          <input class="input" id="email" type="email" autocomplete="email" required placeholder="parent@example.com">
        </label>
        <label class="field">
          <span>비밀번호 <small>8자 이상</small></span>
          <input class="input" id="password" type="password" autocomplete="current-password" minlength="8" required>
        </label>
        <button class="btn btn--primary btn--block" id="submit" type="submit">로그인</button>
        <button class="btn--text" id="forgot" type="button">비밀번호를 잊었어요</button>
        <p class="auth__msg" id="msg" role="status" aria-live="polite"></p>
      </form>

      <a class="auth__back" href="../index.html">← 꼬물상자 소개 보기</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script type="module" src="login.js"></script>
</body>
</html>
